spring.datasource.url=jdbc:h2:mem:cafestory_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false
spring.cache.type=simple
spring.data.redis.repositories.enabled=false
app.data-initializer.enabled=false
app.scheduling.enabled=false
app.jwt.secret=cafestory-test-jwt-secret-change-me-at-least-32-bytes
app.jwt.access-token-seconds=900
app.jwt.refresh-token-seconds=604800
app.auth.cookie.secure=false
app.auth.cookie.same-site=Lax
admin.assistant.tool-token=cafestory-test-assistant-tool-token
rag.internal.secret=cafestory-test-rag-secret
rag.internal.timestamp-window-seconds=300
