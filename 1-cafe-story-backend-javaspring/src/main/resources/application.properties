spring.application.name=cafestory
spring.config.import=optional:classpath:.env[.properties]
spring.profiles.active=dev
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:30000}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:30000}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.validate-on-migrate=${FLYWAY_VALIDATE_ON_MIGRATE:true}

spring.cache.type=${SPRING_CACHE_TYPE:redis}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=${REDIS_TIMEOUT:2s}
spring.data.redis.repositories.enabled=false

spring.servlet.multipart.max-file-size=${UPLOAD_MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${UPLOAD_MAX_REQUEST_SIZE:5MB}
app.upload.root-dir=${UPLOAD_ROOT_DIR:uploads}
app.upload.avatar-dir=${UPLOAD_AVATAR_DIR:uploads/avatars}
app.upload.avatar-public-path=${UPLOAD_AVATAR_PUBLIC_PATH:/uploads/avatars}

springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.with-credentials=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.packages-to-scan=com.cafestory.controller
springdoc.paths-to-match=/api/**,/notifications/**

stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.connect-webhook-secret=${STRIPE_CONNECT_WEBHOOK_SECRET:}
stripe.connect.return-url=${STRIPE_CONNECT_RETURN_URL:http://localhost:3000/reviewer-dashboard/connect/return}
stripe.connect.refresh-url=${STRIPE_CONNECT_REFRESH_URL:http://localhost:3000/reviewer-dashboard/connect/return}
app.payment.success-url=${APP_PAYMENT_SUCCESS_URL:http://localhost:3000/payment/success}
app.payment.cancel-url=${APP_PAYMENT_CANCEL_URL:http://localhost:3000/payment/cancel}
vnpay.tmn-code=${VNPAY_TMN_CODE:}
vnpay.hash-secret=${VNPAY_HASH_SECRET:}
vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:8080/api/payments/vnpay/return}
vnpay.ipn-url=${VNPAY_IPN_URL:http://localhost:8080/api/payments/vnpay/ipn}

app.jwt.secret=${JWT_SECRET:cafestory-dev-jwt-secret-change-me-at-least-32-bytes}
app.jwt.access-token-seconds=${JWT_ACCESS_TOKEN_SECONDS:90000}
app.jwt.refresh-token-seconds=${JWT_REFRESH_TOKEN_SECONDS:604800}
app.auth.cookie.secure=${AUTH_COOKIE_SECURE:false}
app.auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Lax}

ai.moderation.base-url=${AI_MODERATION_BASE_URL:http://localhost:8036}
ai.moderation.timeout-ms=${AI_MODERATION_TIMEOUT_MS:60000}
report.moderation.webhook-url=${REPORT_MODERATION_WEBHOOK_URL:http://localhost:5678/webhook/cafestory-report-moderation}
report.moderation.timeout-ms=${REPORT_MODERATION_TIMEOUT_MS:10000}
report.moderation.worker.batch-size=${REPORT_MODERATION_WORKER_BATCH_SIZE:10}
admin.report.ai.webhook-url=${ADMIN_REPORT_AI_WEBHOOK_URL:http://localhost:5678/webhook/cafestory-admin-report-ai-resolution}
admin.report.ai.timeout-ms=${ADMIN_REPORT_AI_TIMEOUT_MS:15000}
admin.assistant.webhook-url=${ADMIN_ASSISTANT_WEBHOOK_URL:http://localhost:5678/webhook/cafestory-admin-assistant-chat}
admin.assistant.timeout-ms=${ADMIN_ASSISTANT_TIMEOUT_MS:90000}
admin.assistant.model=${OPENAI_ASSISTANT_MODEL:gpt-4o-mini}
admin.assistant.tool-base-url=${ADMIN_ASSISTANT_TOOL_BASE_URL:http://host.docker.internal:8080/api/admin/assistant/tools}
admin.assistant.tool-token=${ADMIN_ASSISTANT_TOOL_TOKEN:}

rag.internal.secret=${RAG_INTERNAL_SECRET:}
rag.internal.timestamp-window-seconds=${RAG_TIMESTAMP_WINDOW:300}
rag.python.base-url=${RAG_PYTHON_BASE_URL:http://localhost:8036}
