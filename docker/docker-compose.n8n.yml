services:
  n8n:
    image: n8nio/n8n:2.28.6
    container_name: cafestory-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    env_file:
      - .env
    environment:
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      NODE_FUNCTION_ALLOW_BUILTIN: "crypto"
      N8N_HOST: "localhost"
      N8N_PORT: "5678"
      N8N_PROTOCOL: "http"
      WEBHOOK_URL: "http://localhost:5678/"
    volumes:
      - cafestory_n8n_data:/home/node/.n8n

volumes:
  cafestory_n8n_data:
